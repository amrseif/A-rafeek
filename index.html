<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>كبسولة المنهج | تسجيل الدخول وبدء المذاكرة الذكية</title>
    <meta name="description" content="كبسولة المنهج - المنصة الذكية لتفكيك المواد والمناهج الدراسية إلى كبسولات وخطوات إنجاز يومية مع جداول بومودورو وبروفايل دراسي سحابي متكامل." />
    <meta name="theme-color" content="#080C14" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet" />
    <style>
      /* Zero-flash fallback styling before React hydrates */
      body {
        margin: 0;
        background-color: #080C14;
        color: #F8FAFC;
        font-family: 'Cairo', system-ui, -apple-system, sans-serif;
        overflow-x: hidden;
      }
      .initial-splash {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: radial-gradient(circle at 50% 30%, rgba(6, 182, 212, 0.12), transparent 70%), #080C14;
        text-align: center;
        padding: 24px;
      }
      .initial-logo-box {
        width: 72px;
        height: 72px;
        border-radius: 24px;
        background: linear-gradient(135deg, #06b6d4, #2563eb);
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 0 30px rgba(6, 182, 212, 0.35);
        margin-bottom: 20px;
      }
      .initial-title {
        font-size: 24px;
        font-weight: 800;
        color: #FFFFFF;
        margin: 0 0 8px 0;
        letter-spacing: -0.5px;
      }
      .initial-sub {
        font-size: 14px;
        color: rgba(255, 255, 255, 0.6);
        margin: 0 0 24px 0;
      }
      .initial-spinner {
        width: 32px;
        height: 32px;
        border: 3px solid rgba(6, 182, 212, 0.2);
        border-top-color: #06b6d4;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body class="bg-[#080C14] text-[#F8FAFC] antialiased font-['Cairo',sans-serif]">
    <div id="root">
      <div class="initial-splash" dir="rtl">
        <div class="initial-logo-box">
          <svg width="38" height="38" viewBox="0 0 24 24" fill="none" stroke="#080C14" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M22 10v6M2 10l10-5 10 5-10 5z"/>
            <path d="M6 12v5c3 3 9 3 12 0v-5"/>
          </svg>
        </div>
        <h1 class="initial-title">كبسولة المنهج</h1>
        <p class="initial-sub">جاري تجهيز مساحتك وشاشة الدخول...</p>
        <div class="initial-spinner"></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
